version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
tasks:
  demo:
    desc: Launch the development file-picker demo on a private D-Bus session
    cmds:
    - task: build
      vars:
        PRESET: dev
    - bash build/dev/native-check.sh --demo
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  qml-import-check:
    desc: qml-import-check
    cmds:
    - python3 scripts/check-runtime-imports.py
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target all_qmllint
  qmltypes-check:
    desc: qmltypes-check
    cmds:
    - python3 scripts/quality.py qmltypes --build build/{{.PRESET}} --module HolonightPortal --module HolonightPortal.Private
