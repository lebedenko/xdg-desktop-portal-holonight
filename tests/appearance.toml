version = 1

[theme]
scheme = "holonight-dark"
accent = "blue"

[typography]
ui_family = "Fira Code"
ui_size = 14
monospace_family = "Inconsolata"
monospace_size = 13
title_family = "Exo"
title_size = 9
display_family = "Orbitron"
